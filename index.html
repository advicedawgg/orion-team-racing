<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Orion Team Racing</title>
<style>
  :root{
    --ink:#0b1020; --paper:#fff6e0; --gold:#ffd23f; --pop:#ff5d73; --cool:#4ec5f1; --purple:#b54dff;
    --ui: 800 clamp(14px,2.4vmin,26px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b1020;color:var(--paper);
    font:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas#c{display:block;width:100%;height:100%;touch-action:none}
  #hud,#hud2,#screens,#touch{position:fixed;inset:0;pointer-events:none}
  .shadow{text-shadow:0 3px 0 rgba(0,0,0,.55)}

  /* ---------- HUD + menus: ui.css (ui agent owns hud.js, menu.js, save.js, ui.css) ---------- */
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- screens (title/loading; ui agent's menu.js takes over) ---------- */
  #screens{display:grid;place-items:center;text-align:center;transition:opacity .35s}
  #screens.hide{opacity:0}
  #screens .card{background:radial-gradient(ellipse at 50% 35%,rgba(26,36,80,.92),rgba(7,10,24,.92) 75%);padding:5vmin 7vmin;border-radius:1.2em}
  #screens h1{font-size:clamp(34px,9vmin,96px);line-height:.95;letter-spacing:-.02em;
     background:linear-gradient(180deg,#fff,#ffd23f 55%,#ff9d2f);-webkit-background-clip:text;
     background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
  #screens h1 small{display:block;font-size:.28em;letter-spacing:.28em;color:#9fb4ff;-webkit-text-fill-color:#9fb4ff;margin-top:.7em}
  #screens .go{margin-top:1.2em;font-size:clamp(16px,3vmin,28px);color:var(--gold);animation:pulse 1.1s ease-in-out infinite}

  /* ---------- touch controls ---------- */
  #touch{display:none}
  body.touch #touch{display:block}
  .tb{position:absolute;width:17vmin;height:17vmin;max-width:120px;max-height:120px;border-radius:50%;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none;
    display:grid;place-items:center;font-size:6vmin;color:#fff}
  .tb.on{background:rgba(255,255,255,.38)}
  .tb[data-btn=left]{left:3vmin;bottom:6vmin} .tb[data-btn=right]{left:23vmin;bottom:6vmin}
  .tb[data-btn=brake]{left:13vmin;bottom:25vmin;width:13vmin;height:13vmin;font-size:4.5vmin}
  .tb[data-btn=hopA]{right:4vmin;bottom:6vmin;width:22vmin;height:22vmin;max-width:150px;max-height:150px}
  .tb[data-btn=hopB]{right:28vmin;bottom:8vmin}
  .tb[data-btn=item]{right:8vmin;bottom:31vmin;width:14vmin;height:14vmin;font-size:5vmin}
  .tb[data-btn=pause]{right:3vmin;top:16vmin;width:10vmin;height:10vmin;font-size:3.5vmin}
</style>
<link rel="stylesheet" href="./ui.css">
<link rel="icon" href="assets/ui/star.png">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden></div>
<div id="hud2" hidden></div>
<div id="split" hidden></div>
<div id="screens"><div class="card" id="card"><h1>ORION TEAM RACING<small>LOADING…</small></h1></div></div>
<div id="touch">
  <div class="tb" data-btn="left">◀</div><div class="tb" data-btn="right">▶</div><div class="tb" data-btn="brake">▼</div>
  <div class="tb" data-btn="hopA">⤴</div><div class="tb" data-btn="hopB">⚡</div><div class="tb" data-btn="item">◆</div>
  <div class="tb" data-btn="pause">❚❚</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
