<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Orion Team Racing</title>
<style>
  :root{
    --ink:#0b1020; --paper:#fff6e0; --gold:#ffd23f; --pop:#ff5d73; --cool:#4ec5f1; --purple:#b54dff;
    --ui: 800 clamp(14px,2.4vmin,26px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0b1020;color:var(--paper);
    font:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas#c{display:block;width:100%;height:100%;touch-action:none}
  #hud,#screens,#touch{position:fixed;inset:0;pointer-events:none}
  .shadow{text-shadow:0 3px 0 rgba(0,0,0,.55)}

  /* ---------- HUD (core stub; ui agent owns hud.js + these rules) ---------- */
  #hud{font-size:clamp(16px,3.4vmin,36px);text-shadow:0 3px 0 rgba(0,0,0,.55)}
  #hud[hidden]{display:none}
  .h-lap{position:absolute;left:3vmin;top:2.5vmin;display:flex;align-items:baseline;gap:.35em}
  .h-lap small{font-size:.55em;letter-spacing:.2em;color:#eaf1ff}
  .h-lap b{font-size:1.25em;color:#fff}
  .h-time{position:absolute;left:3vmin;top:calc(2.5vmin + 1.7em);font-size:.6em;color:#dfe8ff;font-variant-numeric:tabular-nums}
  .h-stars{position:absolute;left:3vmin;top:calc(2.5vmin + 2.8em);font-size:.8em;color:var(--gold)}
  .h-place{position:absolute;right:3.5vmin;top:1.5vmin;font-size:2.6em;color:var(--gold);line-height:1;
    -webkit-text-stroke:.04em #7a3b00}
  .h-place sup{font-size:.4em;vertical-align:top;margin-left:.05em}
  .h-place[data-p="1"]{color:#ffe14a}
  .h-speed{position:absolute;right:3.5vmin;bottom:3vmin;display:flex;align-items:baseline;gap:.25em}
  .h-speed b{font-size:1.4em;font-variant-numeric:tabular-nums}
  .h-speed small{font-size:.5em;color:#dfe8ff}
  .h-meter{position:absolute;left:50%;bottom:4.5vmin;width:min(38vw,380px);height:.7em;transform:translateX(-50%);
    border-radius:.4em;background:rgba(11,16,32,.55);box-shadow:0 0 0 .12em rgba(0,0,0,.45);overflow:visible;opacity:.35;transition:opacity .15s}
  .h-meter[data-s="on"],.h-meter[data-s="red"],.h-meter[data-s="hot"]{opacity:1}
  .h-meter i{position:absolute;left:0;top:0;bottom:0;width:100%;border-radius:.4em;transform-origin:left;transform:scaleX(0);
    background:linear-gradient(90deg,#8fe3ff,#6ff08f 45%,#ffe14a 70%)}
  .h-meter[data-s="red"] i{background:linear-gradient(90deg,#ff9d2f,#ff3b2f);box-shadow:0 0 .6em #ff5a1f}
  .h-meter[data-s="hot"] i{background:#3a3440}
  .h-meter .red{position:absolute;top:-.12em;bottom:-.12em;border-radius:.3em;box-shadow:inset 0 0 0 .12em rgba(255,70,50,.95)}
  .h-meter .pips{position:absolute;left:50%;top:-1.05em;transform:translateX(-50%);display:flex;gap:.3em}
  .h-meter .pips u{display:block;width:.55em;height:.55em;border-radius:50%;background:rgba(255,255,255,.25)}
  .h-meter .pips u.on{background:var(--purple);box-shadow:0 0 .4em var(--purple)}
  .h-boost{position:absolute;left:50%;bottom:2.2vmin;width:min(38vw,380px);height:.28em;transform:translateX(-50%);border-radius:.2em;background:rgba(11,16,32,.35)}
  .h-boost i{display:block;height:100%;border-radius:.2em;transform-origin:left;transform:scaleX(0);background:linear-gradient(90deg,#ffb02e,#ff5a1f)}
  .h-count{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.6);font-size:clamp(60px,20vmin,200px);
    color:#fff;opacity:0;-webkit-text-stroke:.03em #1b2350;text-shadow:0 .06em 0 rgba(0,0,0,.5)}
  .h-count.on{opacity:1}
  .h-count.pop{transform:translate(-50%,-50%) scale(1);transition:transform .25s cubic-bezier(.2,2,.4,1)}
  .h-count.go{color:#6ff08f}
  .h-banner{position:absolute;left:50%;top:22%;transform:translateX(-50%) scale(.8);opacity:0;font-size:clamp(24px,7vmin,70px);
    color:var(--gold);white-space:nowrap;transition:transform .2s cubic-bezier(.2,1.8,.4,1),opacity .2s;-webkit-text-stroke:.03em #7a3b00}
  .h-banner.on{opacity:1;transform:translateX(-50%) scale(1)}
  .h-banner.final{color:#ff6f6f;-webkit-text-stroke-color:#5a0000}
  .h-results{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:none;min-width:min(520px,90vw);
    background:rgba(11,16,32,.82);border-radius:1em;padding:1em 1.4em;box-shadow:0 0 0 .15em rgba(255,210,63,.6)}
  .h-results.on{display:block}
  .h-results h2{text-align:center;color:var(--gold);letter-spacing:.2em;margin-bottom:.5em}
  .h-results ol{list-style:none;font-size:.8em}
  .h-results li{display:flex;gap:1em;padding:.25em .4em;border-radius:.4em}
  .h-results li.me{background:rgba(255,210,63,.25)}
  .h-results .p{width:3em;color:var(--gold)} .h-results .n{flex:1} .h-results .t{font-variant-numeric:tabular-nums;color:#dfe8ff}
  .h-results .again{margin-top:.8em;text-align:center;font-size:.6em;color:#9fb4ff;animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}

  /* ---------- screens (title/loading; ui agent's menu.js takes over) ---------- */
  #screens{display:grid;place-items:center;text-align:center;transition:opacity .35s}
  #screens.hide{opacity:0}
  #screens .card{background:radial-gradient(ellipse at 50% 35%,rgba(26,36,80,.92),rgba(7,10,24,.92) 75%);padding:5vmin 7vmin;border-radius:1.2em}
  #screens h1{font-size:clamp(34px,9vmin,96px);line-height:.95;letter-spacing:-.02em;
     background:linear-gradient(180deg,#fff,#ffd23f 55%,#ff9d2f);-webkit-background-clip:text;
     background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.45))}
  #screens h1 small{display:block;font-size:.28em;letter-spacing:.28em;color:#9fb4ff;-webkit-text-fill-color:#9fb4ff;margin-top:.7em}
  #screens .go{margin-top:1.2em;font-size:clamp(16px,3vmin,28px);color:var(--gold);animation:pulse 1.1s ease-in-out infinite}

  /* ---------- touch controls ---------- */
  #touch{display:none}
  body.touch #touch{display:block}
  .tb{position:absolute;width:17vmin;height:17vmin;max-width:120px;max-height:120px;border-radius:50%;
    background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);pointer-events:auto;touch-action:none;
    display:grid;place-items:center;font-size:6vmin;color:#fff}
  .tb.on{background:rgba(255,255,255,.38)}
  .tb[data-btn=left]{left:3vmin;bottom:6vmin} .tb[data-btn=right]{left:23vmin;bottom:6vmin}
  .tb[data-btn=brake]{left:13vmin;bottom:25vmin;width:13vmin;height:13vmin;font-size:4.5vmin}
  .tb[data-btn=hopA]{right:4vmin;bottom:6vmin;width:22vmin;height:22vmin;max-width:150px;max-height:150px}
  .tb[data-btn=hopB]{right:28vmin;bottom:8vmin}
  .tb[data-btn=item]{right:8vmin;bottom:31vmin;width:14vmin;height:14vmin;font-size:5vmin}
  .tb[data-btn=pause]{right:3vmin;top:16vmin;width:10vmin;height:10vmin;font-size:3.5vmin}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden></div>
<div id="screens"><div class="card" id="card"><h1>ORION TEAM RACING<small>LOADING…</small></h1></div></div>
<div id="touch">
  <div class="tb" data-btn="left">◀</div><div class="tb" data-btn="right">▶</div><div class="tb" data-btn="brake">▼</div>
  <div class="tb" data-btn="hopA">⤴</div><div class="tb" data-btn="hopB">⚡</div><div class="tb" data-btn="item">🎁</div>
  <div class="tb" data-btn="pause">⏸</div>
</div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
